<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7e487">
<meta name="description" content="Interactive 3D tri-fold District 31 PPS Director brochure.">
<title>District 31 PPS Director — Interactive 3D Brochure</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7e487}iframe{display:block;width:100%;height:100%;border:0;background:#f7e487}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,#fff,transparent 28%),linear-gradient(145deg,#fff8d7,#f7e487);font:800 16px system-ui;color:#20366b;z-index:2;transition:.35s}.loading.hide{opacity:0;visibility:hidden}.spinner{width:42px;height:42px;border-radius:50%;border:5px solid rgba(32,54,107,.15);border-top-color:#ff6817;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading" id="loading"><div><div class="spinner"></div>Preparing the brochure…</div></div>
<iframe id="brochureFrame" title="District 31 interactive tri-fold brochure" src="https://raw.githack.com/MrBobb808/project-walkthroughs/a6e857b70c74efc89535dbd56e3eeadac2c4035c/district31-pps-brochure/index.html"></iframe>
<script>
(() => {
  const frame = document.getElementById('brochureFrame');
  const loading = document.getElementById('loading');

  frame.addEventListener('load', () => {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    if (!doc) return;

    const style = doc.createElement('style');
    style.textContent = `
      :root{--paper-w:1100px!important;--paper-h:850px!important;--panel-w:calc(var(--paper-w)/3)!important}
      html,body{width:100%!important;height:100%!important;overflow:hidden!important}
      .app{height:100dvh!important;grid-template-rows:auto minmax(0,1fr) auto!important}
      .topbar{padding:12px clamp(14px,2.3vw,30px)!important}
      .workspace{min-height:0!important;padding:4px 14px 5px!important;overflow:hidden!important}
      .scene{width:var(--paper-w)!important;height:var(--paper-h)!important;perspective:2600px!important;transition:transform .25s ease!important}
      .brochure{transform-style:preserve-3d!important;filter:drop-shadow(0 26px 30px rgba(32,54,107,.24))!important}
      .sheet,.panel{transform-style:preserve-3d!important}
      .panel{transition:none!important;will-change:transform!important}
      .controls{padding:7px 10px 11px!important;gap:7px!important}
      .control{padding:9px 13px!important}
      .floaty{opacity:.42!important}
      .panel:before{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.26;background:linear-gradient(90deg,rgba(255,255,255,.25),transparent 8%,transparent 91%,rgba(25,42,78,.2));mix-blend-mode:soft-light}
      .panel:not(:last-child):after{width:3px!important;right:-1px!important;box-shadow:4px 0 13px rgba(22,35,67,.22)!important}
      .cover-card{transform-style:preserve-3d!important;box-shadow:8px 9px 0 rgba(255,255,255,.45),16px 18px 0 rgba(32,54,107,.09),0 28px 54px rgba(32,54,107,.28)!important}

      .brochure.unfolding .cover-card{animation:coverPeel 760ms cubic-bezier(.2,.88,.18,1) both!important}
      .brochure.unfolding .panel.p1{animation:paperOpenLeft 1080ms cubic-bezier(.18,.96,.2,1.08) both 80ms!important}
      .brochure.unfolding .panel.p3{animation:paperOpenRight 1180ms cubic-bezier(.18,.96,.2,1.08) both 220ms!important}
      .brochure.folding .panel.p1{animation:paperCloseLeft 900ms cubic-bezier(.24,.74,.18,1) both 80ms!important}
      .brochure.folding .panel.p3{animation:paperCloseRight 930ms cubic-bezier(.24,.74,.18,1) both!important}

      @keyframes coverPeel{
        0%{opacity:1;transform:translate(-50%,-50%) rotateY(0) rotateZ(-.25deg) translateZ(18px)}
        45%{opacity:1;transform:translate(-26%,-50%) rotateY(-48deg) rotateZ(1.4deg) translateZ(42px)}
        100%{opacity:0;transform:translate(34%,-50%) rotateY(-83deg) rotateZ(3deg) translateZ(16px) scale(.95)}
      }
      @keyframes paperOpenLeft{
        0%{transform:translateX(var(--panel-w)) rotateY(179.6deg) translateZ(3px)}
        56%{transform:translateX(-1.7%) rotateY(-7deg) translateZ(10px)}
        78%{transform:translateX(.7%) rotateY(2.5deg) translateZ(4px)}
        100%{transform:translateX(0) rotateY(0) translateZ(0)}
      }
      @keyframes paperOpenRight{
        0%{transform:translateX(calc(var(--panel-w)*-1)) rotateY(-179.6deg) translateZ(2px)}
        54%{transform:translateX(1.9%) rotateY(8deg) translateZ(11px)}
        78%{transform:translateX(-.7%) rotateY(-2.7deg) translateZ(4px)}
        100%{transform:translateX(0) rotateY(0) translateZ(0)}
      }
      @keyframes paperCloseLeft{
        0%{transform:translateX(0) rotateY(0) translateZ(0)}
        35%{transform:translateX(-.8%) rotateY(-4deg) translateZ(6px)}
        100%{transform:translateX(var(--panel-w)) rotateY(179.6deg) translateZ(3px)}
      }
      @keyframes paperCloseRight{
        0%{transform:translateX(0) rotateY(0) translateZ(0)}
        35%{transform:translateX(.8%) rotateY(4deg) translateZ(6px)}
        100%{transform:translateX(calc(var(--panel-w)*-1)) rotateY(-179.6deg) translateZ(2px)}
      }

      @media(max-width:760px){
        .topbar{padding:9px 11px!important}.controls{padding:5px 6px 9px!important}.control{padding:8px 10px!important;font-size:11px!important}
      }
    `;
    doc.head.appendChild(style);

    const brochure = doc.getElementById('brochure');
    const scene = doc.getElementById('scene');
    const workspace = doc.querySelector('.workspace');
    const openBtn = doc.getElementById('openBtn');
    const coverHint = doc.getElementById('coverHint');
    const launch = doc.getElementById('launch');

    function fit() {
      if (!workspace || !scene) return;
      const r = workspace.getBoundingClientRect();
      const ratio = 1.294;
      const maxW = Math.max(300, r.width - 34);
      const maxH = Math.max(250, r.height - 20);
      let w = Math.min(maxW, maxH * ratio);
      let h = w / ratio;
      if (h > maxH) { h = maxH; w = h * ratio; }
      doc.documentElement.style.setProperty('--paper-w', w + 'px', 'important');
      doc.documentElement.style.setProperty('--paper-h', h + 'px', 'important');
      doc.documentElement.style.setProperty('--panel-w', (w / 3) + 'px', 'important');
    }

    function animateFold() {
      if (!brochure) return;
      const opening = !brochure.classList.contains('open');
      brochure.classList.remove('unfolding','folding');
      void brochure.offsetWidth;
      brochure.classList.add(opening ? 'unfolding' : 'folding');
      win.setTimeout(() => brochure.classList.remove('unfolding','folding'), 1320);
    }

    [openBtn, coverHint].filter(Boolean).forEach(el => el.addEventListener('click', animateFold, true));
    if (launch) launch.addEventListener('click', () => {
      win.setTimeout(() => {
        brochure.classList.remove('unfolding','folding');
        void brochure.offsetWidth;
        brochure.classList.add('unfolding');
        win.setTimeout(() => brochure.classList.remove('unfolding'), 1320);
      }, 285);
    }, true);

    doc.addEventListener('keydown', e => {
      if (e.code === 'Space' && !doc.body.dataset.modal) animateFold();
    }, true);

    const resize = new win.ResizeObserver(fit);
    resize.observe(workspace);
    win.addEventListener('resize', fit);
    fit();
    win.setTimeout(fit, 150);
    win.setTimeout(fit, 700);

    loading.classList.add('hide');
  });
})();
</script>
</body>
</html>
